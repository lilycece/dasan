<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다산2동 홍보물 시안 검수 안내</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(233, 213, 255, 0.6);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

  <!-- Header (최소화된 크기) -->
  <header class="border-b border-purple-100 bg-white/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-12 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-purple-600 animate-pulse"></span>
        <h1 class="font-bold text-slate-900 text-sm tracking-tight">다산2동 홍보물 시안 전달</h1>
      </div>
      <span class="text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-purple-50 text-purple-700 border border-purple-200">
        작업물
      </span>
    </div>
  </header>

  <!-- Main Content (여백 컴팩트 조정) -->
  <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 py-4 space-y-4">
    
    <!-- Hero Banner (슬림 라인 디자인) -->
    <div class="relative overflow-hidden rounded-xl bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 text-white px-5 py-3.5 shadow-sm">
      <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
        <div class="flex items-center space-x-2.5">
          <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-purple-500/30 text-purple-200 border border-purple-400/30 shrink-0">
            외주 제작 결과물
          </span>
          <h2 class="text-base sm:text-lg font-bold tracking-tight text-white">
            다산2동 홍보물 시안 검수
          </h2>
        </div>
        <p class="text-purple-200/90 text-xs leading-none">
          제작 완료된 홍보 영상 시안 및 PPT/PDF 문서 자료입니다.
        </p>
      </div>
    </div>

    <!-- Main Grid: Video & Drive -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      
      <!-- Video Player Section (2 Cols) -->
      <div class="lg:col-span-2 space-y-3">
        <div class="glass-card rounded-xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2.5">
            <h3 class="font-bold text-slate-900 text-xs sm:text-sm flex items-center space-x-1.5">
              <i class="fa-solid fa-circle-play text-purple-600"></i>
              <span>홍보 영상 시안 (유튜브 일부공개)</span>
            </h3>
            <a href="https://youtu.be/qn64fMbNUd0?si=g-LhIxVq-Z4JZpYP" target="_blank" rel="noopener noreferrer" class="text-[11px] font-semibold text-purple-600 hover:text-purple-700 flex items-center space-x-1 transition-colors">
              <span>유튜브에서 보기</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
            </a>
          </div>
          
          <!-- Video Aspect Container -->
          <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-slate-900 shadow-inner">
            <iframe class="w-full h-full border-0" src="https://www.youtube.com/embed/qn64fMbNUd0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
      </div>

      <!-- Drive & Support Section (1 Col) -->
      <div class="space-y-4">
        
        <!-- Google Drive Direct Cards -->
        <div class="glass-card rounded-xl p-4 shadow-sm space-y-3">
          <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-purple-100 flex items-center justify-center text-purple-600 shrink-0">
              <i class="fa-solid fa-folder-open text-sm"></i>
            </div>
            <div>
              <h3 class="font-bold text-slate-900 text-sm">PPT / PDF 원본 자료</h3>
              <p class="text-[11px] text-slate-500">클릭 시 구글 드라이브로 즉시 이동합니다.</p>
            </div>
          </div>

          <div class="space-y-2 pt-1">
            <!-- PPT Direct Link -->
            <a href="https://drive.google.com/drive/folders/1VyAjFfeT1RcFfve1ETF8pKD68te5HbMa?usp=sharing" target="_blank" rel="noopener noreferrer" class="w-full py-2.5 px-3.5 rounded-lg bg-purple-600 hover:bg-purple-700 text-white font-semibold text-xs transition-all flex items-center justify-between shadow-sm active:scale-[0.98]">
              <div class="flex items-center space-x-2">
                <i class="fa-solid fa-file-powerpoint text-sm"></i>
                <span>PPT 원본 폴더 열기</span>
              </div>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-80"></i>
            </a>

            <!-- PDF Direct Link -->
            <a href="https://drive.google.com/drive/folders/1gJUonDwIZLLQNJG9YDTVHqHbZ04b6Zk8?usp=drive_link" target="_blank" rel="noopener noreferrer" class="w-full py-2.5 px-3.5 rounded-lg bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-900 font-semibold text-xs transition-all flex items-center justify-between active:scale-[0.98]">
              <div class="flex items-center space-x-2">
                <i class="fa-solid fa-file-pdf text-purple-600 text-sm"></i>
                <span>PDF 문서 폴더 열기</span>
              </div>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-purple-400"></i>
            </a>
          </div>
        </div>

        <!-- Contact Box -->
        <div class="glass-card rounded-xl p-4 shadow-sm space-y-2.5 border-l-4 border-l-purple-600">
          <h4 class="font-bold text-slate-900 text-xs flex items-center space-x-1.5">
            <i class="fa-solid fa-envelope-open-text text-purple-600"></i>
            <span>수정 사항 문의</span>
          </h4>
          <p class="text-[11px] text-slate-600 leading-normal">
            시안확인후 수정 문의는 이메일이나 전화연락 바랍니다.
          </p>
          <div class="flex items-center justify-between p-2 rounded-lg bg-purple-50/60 border border-purple-100 text-xs">
            <span class="font-mono text-purple-900 font-semibold text-[11px] select-all">lilyjisuk7@naver.com</span>
            <button onclick="copyEmail()" class="text-purple-600 hover:text-purple-800 font-semibold text-[10px] px-2 py-0.5 rounded bg-white shadow-sm transition-all">
              복사
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white px-3.5 py-2.5 rounded-xl shadow-xl text-xs font-medium flex items-center space-x-2">
      <i class="fa-solid fa-circle-check text-purple-400"></i>
      <span>이메일 주소가 복사되었습니다.</span>
    </div>
  </div>

  <script>
    function copyEmail() {
      navigator.clipboard.writeText("lilyjisuk7@naver.com").then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 2500);
      });
    }
  </script>
</body>
</html>
